# =============================================================
# docker-compose.prod.yml — Production overrides
# =============================================================
# **IMPORTANT**: This compose file NO LONGER includes nginx or certbot.
# Instead, use a SINGLE host-level Nginx to route both:
#   - weiyiliuxue.com → lab project (port 3001)
#   - synaping.com    → neurolab project (port 3002)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This allows multiple projects on the same server without port conflicts.
# =============================================================
version: "3.9"
services:
  mongodb:
    restart: always
    environment:
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    restart: always
    volumes: []  # Remove dev source mount
    ports:
      # Expose on internal port 8002 (host Nginx will proxy to this)
      - "8002:8000"
    environment:
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      - MONGO_DB=${MONGO_DB:-neurolab}
      - ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://synaping.com,https://www.synaping.com}
      - SECRET_KEY=${SECRET_KEY}
      - WORKERS=${WORKERS:-2}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    restart: always
    build:
      target: production
      args:
        - VITE_API_URL=https://synaping.com
    ports:
      # Expose on internal port 3002 (host Nginx will proxy to this)
      - "3002:80"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ======================================================================
  # nginx and certbot services REMOVED — use host-level Nginx instead.
  # See deployment instructions for host Nginx configuration.
  # ======================================================================
