# =============================================================
# docker-compose.prod.yml — Production overrides
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Overrides docker-compose.yml with production settings:
#   - Removes dev source-mount volumes (uses built images)
#   - Adds SSL cert volumes to Nginx
#   - Enables certbot container for Let's Encrypt renewal
#   - Sets production environment variables
#   - Passes VITE_API_URL as a build ARG (baked in at build time)
# =============================================================
version: "3.9"
services:
  mongodb:
    restart: always
    environment:
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  backend:
    restart: always
    volumes: []  # Remove dev source mount; image is used as-is
    environment:
      - MONGO_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017
      - MONGO_DB=${MONGO_DB:-neurolab}
      - ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://synaping.com,https://www.synaping.com}
      - SECRET_KEY=${SECRET_KEY}
      - WORKERS=${WORKERS:-2}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    restart: always
    build:
      target: production
      # VITE_API_URL is baked into the React bundle at build time —
      # it cannot be set at runtime for a static Nginx container.
      args:
        - VITE_API_URL=https://synaping.com
    # NOTE: No 'environment' for VITE_* here — Vite vars are build-time only.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount only the production config — avoids conflicts with default.conf
      - ./nginx/conf.d/synaping.com.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # Let's Encrypt certificate renewal (runs every 12h)
  certbot:
    image: certbot/certbot:latest
    container_name: neurolab_certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - neurolab_net
